<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1c4a"/>
      <stop offset=".55" stop-color="#16202e"/>
      <stop offset="1" stop-color="#0c2a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".3" r=".55">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#b8338f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(80 150)">
    <text font-size="92" font-weight="800" fill="#fff" letter-spacing="-3">Top<tspan fill="#ff8fc0">Note</tspan></text>
    <text y="58" font-size="26" fill="#fff" fill-opacity=".72">Synced lyrics that float above everything.</text>
    <text y="98" font-size="20" fill="#fff" fill-opacity=".45">An always-on-top Spotify companion for Windows</text>
  </g>

  <!-- mini window -->
  <g transform="translate(730 56)" filter="url(#shadow)">
    <rect width="390" height="288" rx="16" fill="#1b1622"/>
    <rect width="390" height="288" rx="16" fill="url(#art)" opacity=".18"/>
    <rect x=".5" y=".5" width="389" height="287" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
    <rect x="22" y="22" width="56" height="56" rx="7" fill="url(#art)"/>
    <path d="M57 36v19.5a6 6 0 1 1-3-5.2V40l-9 2v15.5a6 6 0 1 1-3-5.2V38z" fill="#fff" fill-opacity=".9"/>
    <rect x="92" y="32" width="150" height="12" rx="6" fill="#fff" fill-opacity=".85"/>
    <rect x="92" y="54" width="96" height="10" rx="5" fill="#fff" fill-opacity=".4"/>
    <text x="24" y="128" font-size="19" font-weight="700" fill="#fff" fill-opacity=".35">and the city hums along</text>
    <text x="24" y="170" font-size="27" font-weight="800" fill="#ff8fc0">I can hear it on top</text>
    <text x="24" y="196" font-size="15" font-weight="600" fill="#fff" fill-opacity=".6">je l'entends tout en haut</text>
    <text x="24" y="236" font-size="19" font-weight="700" fill="#fff" fill-opacity=".5">of every window I own</text>
    <rect x="24" y="262" width="342" height="4" rx="2" fill="#fff" fill-opacity=".18"/>
    <rect x="24" y="262" width="196" height="4" rx="2" fill="#ff8fc0"/>
  </g>
</svg>
